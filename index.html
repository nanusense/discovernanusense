<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Discover stories from Nanusense — browse by category or dive into the archive.">
  <title>Nanusense / Discover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body { background: #0f0f0f; min-height: 100%; transition: background .35s; }
    body.light { background: #f2f0eb; }
  </style>
</head>
<body>

<style>
/* ══════════════════════════════════════════════════
   NANUSENSE DISCOVER
══════════════════════════════════════════════════ */
.nsd {
  --bg:      #0f0f0f;
  --surface: #1a1a1a;
  --srf2:    #252525;
  --text:    #e8e8e8;
  --muted:   #777;
  --border:  #2d2d2d;
  --hdr:     rgba(15,15,15,.92);
  background: var(--bg); color: var(--text);
  font-family: 'Outfit', system-ui, sans-serif;
  min-height: 100vh; transition: background .35s, color .35s;
}
.nsd[data-theme="light"] {
  --bg: #f2f0eb; --surface: #fff; --srf2: #e8e5de;
  --text: #111; --muted: #777; --border: #ddd;
  --hdr: rgba(242,240,235,.92);
}

/* ── HEADER ──────────────────────────────────── */
.nsd-hdr {
  position: sticky; top: 0; z-index: 300;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 48px; height: 64px;
  background: var(--hdr);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255,255,255,.05);
  transition: background .35s;
}
.nsd[data-theme="light"] .nsd-hdr { border-bottom-color: var(--border); }
.nsd-logo { display: flex; align-items: baseline; gap: 6px; text-decoration: none; }
.nsd-logo-main { font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:.06em; color:#fff; transition:color .35s; }
.nsd[data-theme="light"] .nsd-logo-main { color:#111; }
.nsd-logo-sub { font-size:12px; font-weight:300; letter-spacing:.12em; text-transform:uppercase; color:#666; }
.nsd-theme-btn {
  width:36px; height:36px; border-radius:50%;
  border:1px solid var(--border); background:var(--surface); color:var(--text);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:border-color .2s,transform .3s,background .35s; flex-shrink:0; -webkit-appearance:none;
}
.nsd-theme-btn:hover { border-color:var(--muted); transform:rotate(22deg); }
.nsd-theme-btn svg { width:15px; height:15px; pointer-events:none; }

/* ── HERO ────────────────────────────────────── */
.nsd-hero { position:relative; height:68vh; min-height:420px; overflow:hidden; display:flex; align-items:flex-end; }
.nsd-hero-bg { position:absolute; inset:0; background-size:cover; background-position:center top; transition:opacity .7s ease; }
.nsd-hero-veil {
  position:absolute; inset:0;
  background:linear-gradient(to top,rgba(15,15,15,1) 0%,rgba(15,15,15,.65) 30%,rgba(15,15,15,.15) 60%,rgba(15,15,15,.35) 100%);
  transition:background .35s;
}
.nsd[data-theme="light"] .nsd-hero-veil {
  background:linear-gradient(to top,rgba(242,240,235,1) 0%,rgba(0,0,0,.5) 30%,rgba(0,0,0,.1) 60%,rgba(0,0,0,.25) 100%);
}
.nsd-hero-content { position:relative; z-index:2; padding:0 56px 52px; max-width:620px; transition:opacity .5s ease; }
.nsd-hero-pill { display:inline-flex; align-items:center; padding:4px 12px; border-radius:4px; font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:#fff; margin-bottom:14px; }
.nsd-hero-title { font-family:'Bebas Neue',sans-serif; font-size:clamp(38px,5.5vw,66px); line-height:1.0; letter-spacing:.03em; color:#fff; margin:0 0 14px; text-shadow:0 4px 30px rgba(0,0,0,.5); }
.nsd-hero-excerpt { font-size:14px; font-weight:300; color:rgba(255,255,255,.82); line-height:1.75; margin-bottom:26px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.nsd-hero-btns { display:flex; gap:10px; flex-wrap:wrap; }
.nsd-hero-btn-a { display:inline-flex; align-items:center; gap:8px; padding:11px 26px; border-radius:5px; background:#fff; color:#000; font-family:'Outfit',sans-serif; font-size:14px; font-weight:600; text-decoration:none; border:none; cursor:pointer; transition:background .2s; -webkit-appearance:none; }
.nsd-hero-btn-a:hover { background:rgba(255,255,255,.82); }
.nsd-hero-btn-b { display:inline-flex; align-items:center; gap:8px; padding:11px 26px; border-radius:5px; background:rgba(100,100,100,.45); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); color:#fff; font-family:'Outfit',sans-serif; font-size:14px; font-weight:500; border:none; cursor:pointer; transition:background .2s; -webkit-appearance:none; }
.nsd-hero-btn-b:hover { background:rgba(100,100,100,.65); }
.nsd-hero-dots { position:absolute; bottom:18px; right:56px; display:flex; gap:6px; z-index:3; }
.nsd-hero-dot { width:6px; height:6px; border-radius:50%; border:none; background:rgba(255,255,255,.35); cursor:pointer; padding:0; transition:background .3s,transform .3s; flex-shrink:0; -webkit-appearance:none; }
.nsd-hero-dot.active { background:#fff; transform:scale(1.3); }

/* ── GRID ROWS ───────────────────────────────── */
.nsd-main { padding:40px 0 100px; }
.nsd-row { margin-bottom:44px; opacity:0; transform:translateY(12px); animation:nsd-in .5s ease forwards; }
@keyframes nsd-in { to { opacity:1; transform:none; } }
.nsd-row-hdr { display:flex; align-items:center; gap:12px; padding:0 48px; margin-bottom:16px; }
.nsd-row-name { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:.06em; color:var(--row-color,#d4a853); white-space:nowrap; }
.nsd-row-count { font-size:11px; font-weight:300; color:var(--muted); letter-spacing:.06em; white-space:nowrap; }
.nsd-row-rule { flex:1; height:1px; background:var(--border); min-width:16px; }
.nsd-shuffle-btn { display:flex; align-items:center; gap:6px; padding:6px 14px; border-radius:4px; border:1px solid var(--row-color,#d4a853); background:transparent; color:var(--row-color,#d4a853); font-family:'Outfit',sans-serif; font-size:11px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; cursor:pointer; white-space:nowrap; transition:background .2s,color .2s; -webkit-appearance:none; }
.nsd-shuffle-btn:hover { background:var(--row-color,#d4a853); color:#fff; }
.nsd-shuffle-btn svg { width:12px; height:12px; flex-shrink:0; transition:transform .4s; }
.nsd-shuffle-btn:hover svg { transform:rotate(180deg); }
.nsd-track-wrap { position:relative; }
.nsd-track-wrap::after { content:''; position:absolute; right:0; top:0; bottom:18px; width:80px; background:linear-gradient(to right,transparent,var(--bg)); pointer-events:none; z-index:2; transition:background .35s; }
.nsd-track { display:flex; gap:10px; padding:10px 48px 22px; overflow-x:auto; overflow-y:clip; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
.nsd-track::-webkit-scrollbar { height:3px; }
.nsd-track::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
.nsd-card { position:relative; flex:0 0 230px; height:130px; border-radius:7px; overflow:hidden; scroll-snap-align:start; cursor:pointer; background:linear-gradient(135deg,var(--row-color,#d4a853) 0%,#1a1a1a 130%); transition:transform .25s ease,box-shadow .25s ease; z-index:1; border:none; padding:0; -webkit-appearance:none; }
.nsd-card:hover { transform:scale(1.07) translateY(-5px); box-shadow:0 22px 44px rgba(0,0,0,.75); z-index:20; }
.nsd-card-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform .4s ease; }
.nsd-card:hover .nsd-card-img { transform:scale(1.06); }
.nsd-card-grad { position:absolute; inset:0; background:linear-gradient(to top,rgba(0,0,0,.92) 0%,rgba(0,0,0,.35) 55%,rgba(0,0,0,0) 100%); }
.nsd-card-body { position:absolute; bottom:0; left:0; right:0; padding:10px 12px; }
.nsd-card-date { font-size:9px; font-weight:400; letter-spacing:.09em; text-transform:uppercase; color:rgba(255,255,255,.55); margin-bottom:4px; }
.nsd-card-title { font-size:12px; font-weight:600; color:#fff; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.nsd-card-hover { position:absolute; inset:0; background:rgba(0,0,0,.42); display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .22s; }
.nsd-card:hover .nsd-card-hover { opacity:1; }
.nsd-card-play { display:inline-flex; align-items:center; gap:7px; padding:8px 18px; border-radius:4px; background:rgba(255,255,255,.95); color:#000; font-family:'Outfit',sans-serif; font-size:12px; font-weight:700; letter-spacing:.02em; }
.nsd-skel-card { flex:0 0 230px; height:130px; border-radius:7px; scroll-snap-align:start; flex-shrink:0; background:linear-gradient(90deg,var(--srf2) 25%,var(--border) 50%,var(--srf2) 75%); background-size:300% 100%; animation:nsd-shimmer 1.7s infinite; }
.nsd-skel-line { border-radius:3px; background:linear-gradient(90deg,var(--srf2) 25%,var(--border) 50%,var(--srf2) 75%); background-size:300% 100%; animation:nsd-shimmer 1.7s infinite; }
@keyframes nsd-shimmer { 0%{background-position:100% 0} 100%{background-position:-100% 0} }
.nsd-msg { padding:0 48px; color:var(--muted); font-size:13px; font-weight:300; }

/* ══════════════════════════════════════════════════
   STORY MODE
══════════════════════════════════════════════════ */
.nsd-story {
  position:fixed; inset:0; z-index:400;
  background:var(--bg); color:var(--text);
  display:flex; flex-direction:column;
  transform:translateY(100%);
  transition:transform .45s cubic-bezier(.32,.72,0,1);
  will-change:transform;
}
.nsd-story.open { transform:translateY(0); }

.nsd-story-topbar {
  display:flex; align-items:center; gap:10px;
  padding:0 16px; height:54px;
  border-bottom:1px solid var(--border);
  flex-shrink:0; transition:border-color .35s;
}
.nsd-story-back {
  width:38px; height:38px; border-radius:50%;
  border:1px solid var(--border); background:var(--surface); color:var(--text);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; flex-shrink:0; transition:border-color .2s,background .35s; -webkit-appearance:none;
}
.nsd-story-back:hover { border-color:var(--muted); }
.nsd-story-back svg { width:16px; height:16px; pointer-events:none; }

.nsd-story-pills-wrap { flex:1; overflow:hidden; position:relative; }
.nsd-story-pills-wrap::after { content:''; position:absolute; right:0; top:0; bottom:0; width:24px; background:linear-gradient(to right,transparent,var(--bg)); pointer-events:none; transition:background .35s; }
.nsd-story-pills { display:flex; gap:6px; overflow-x:auto; padding:4px 2px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
.nsd-story-pills::-webkit-scrollbar { display:none; }
.nsd-story-pill { flex-shrink:0; padding:5px 12px; border-radius:20px; border:1px solid var(--border); background:transparent; color:var(--muted); font-family:'Outfit',sans-serif; font-size:11px; font-weight:500; letter-spacing:.04em; cursor:pointer; white-space:nowrap; transition:all .2s; -webkit-appearance:none; }
.nsd-story-pill.active { border-color:var(--pill-color,#d4a853); background:var(--pill-color,#d4a853); color:#fff; }
.nsd-story-pill:not(.active):hover { border-color:var(--muted); color:var(--text); }
.nsd-story-counter { flex-shrink:0; font-size:11px; font-weight:400; color:var(--muted); letter-spacing:.04em; white-space:nowrap; }

.nsd-story-prog-rail { height:2px; background:var(--border); flex-shrink:0; transition:background .35s; }
.nsd-story-prog-bar { height:100%; width:0%; background:var(--accent,#d4a853); transition:width .1s linear,background .35s; }

.nsd-story-scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
.nsd-story-scroll::-webkit-scrollbar { width:3px; }
.nsd-story-scroll::-webkit-scrollbar-thumb { background:var(--border); }

.nsd-story-article { max-width:680px; margin:0 auto; padding:0 0 40px; animation:nsd-art-in .35s ease; }
@keyframes nsd-art-in { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none} }
.nsd-story-article.slide-left  { animation:nsd-slide-l .3s ease; }
.nsd-story-article.slide-right { animation:nsd-slide-r .3s ease; }
@keyframes nsd-slide-l { from{opacity:0;transform:translateX(40px)} to{opacity:1;transform:none} }
@keyframes nsd-slide-r { from{opacity:0;transform:translateX(-40px)} to{opacity:1;transform:none} }

.nsd-story-img-wrap { width:100%; max-height:420px; overflow:hidden; background:var(--srf2); }
.nsd-story-img { width:100%; max-height:420px; object-fit:cover; display:block; height:auto!important; }
.nsd-story-img-placeholder { width:100%; height:280px; display:flex; align-items:center; justify-content:center; font-family:'Bebas Neue',sans-serif; font-size:52px; letter-spacing:.06em; color:rgba(255,255,255,.07); }

.nsd-story-body { padding:28px 24px 0; }
.nsd-story-meta { display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
.nsd-story-cat-pill { display:inline-flex; padding:3px 10px; border-radius:4px; font-size:10px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:#fff; }
.nsd-story-meta-info { font-size:12px; font-weight:300; color:var(--muted); letter-spacing:.03em; }
.nsd-story-title { font-family:'Bebas Neue',sans-serif; font-size:clamp(30px,5vw,48px); line-height:1.05; letter-spacing:.02em; color:var(--text); margin-bottom:24px; }

.nsd-story-content { font-size:17px; font-weight:300; line-height:1.88; color:var(--text); }
.nsd-story-content p { margin:0 0 1.2em; }
.nsd-story-content h1,.nsd-story-content h2,.nsd-story-content h3 { font-family:'Bebas Neue',sans-serif; font-weight:400; letter-spacing:.04em; line-height:1.1; margin:1.7em 0 .5em; color:var(--text); }
.nsd-story-content a { color:var(--accent,#d4a853); }
.nsd-story-content img { max-width:100%; height:auto!important; border-radius:6px; margin:.8em 0; display:block; }
.nsd-story-content figure { margin:1em 0; }
.nsd-story-content figcaption { font-size:12px; color:var(--muted); text-align:center; margin-top:4px; }
.nsd-story-content blockquote { border-left:3px solid var(--accent,#d4a853); margin:1.2em 0; padding:.5em 1.2em; color:var(--muted); font-style:italic; }
.nsd-story-content ul,.nsd-story-content ol { padding-left:1.5em; margin:0 0 1em; }
.nsd-story-content li { margin-bottom:.4em; }

.nsd-yt-wrap { position:relative; border-radius:8px; overflow:hidden; margin:1em 0; background:#000; }
.nsd-yt-wrap img { width:100%; display:block; opacity:.85; }
.nsd-yt-btn { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-decoration:none; }
.nsd-yt-btn svg { width:56px; height:56px; filter:drop-shadow(0 2px 12px rgba(0,0,0,.6)); transition:transform .2s; }
.nsd-yt-btn:hover svg { transform:scale(1.1); }

.nsd-story-skel { padding:0 24px 24px; display:flex; flex-direction:column; gap:10px; }

/* Up Next */
.nsd-story-upnext { margin:36px 24px 0; padding:20px; border-radius:10px; border:1px solid var(--border); background:var(--surface); transition:border-color .35s,background .35s; }
.nsd-upnext-label { font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:14px; }
.nsd-upnext-inner { display:flex; gap:14px; align-items:flex-start; }
.nsd-upnext-thumb { flex-shrink:0; width:72px; height:48px; border-radius:5px; object-fit:cover; background:var(--srf2); display:block; height:48px!important; }
.nsd-upnext-thumb-ph { flex-shrink:0; width:72px; height:48px; border-radius:5px; display:flex; align-items:center; justify-content:center; font-family:'Bebas Neue',sans-serif; font-size:18px; color:rgba(255,255,255,.15); }
.nsd-upnext-info { flex:1; min-width:0; }
.nsd-upnext-cat { font-size:10px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; margin-bottom:4px; }
.nsd-upnext-title { font-family:'Bebas Neue',sans-serif; font-size:17px; letter-spacing:.02em; line-height:1.2; color:var(--text); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.nsd-upnext-btn { width:100%; margin-top:14px; padding:11px; border-radius:6px; border:none; background:var(--accent,#d4a853); color:#fff; font-family:'Outfit',sans-serif; font-size:13px; font-weight:600; cursor:pointer; transition:opacity .2s; -webkit-appearance:none; }
.nsd-upnext-btn:hover { opacity:.85; }

/* Bottom nav */
.nsd-story-nav { flex-shrink:0; display:flex; align-items:center; gap:8px; padding:10px 16px 14px; border-top:1px solid var(--border); background:var(--surface); transition:background .35s,border-color .35s; }
.nsd-nav-btn { width:44px; height:44px; border-radius:50%; border:1px solid var(--border); background:var(--srf2); color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition:border-color .2s,background .2s; -webkit-appearance:none; }
.nsd-nav-btn:hover { border-color:var(--muted); }
.nsd-nav-btn:disabled { opacity:.3; cursor:default; }
.nsd-nav-btn svg { width:18px; height:18px; pointer-events:none; }
.nsd-nav-middle { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; min-width:0; padding:0 4px; }
.nsd-nav-hint { font-size:9px; font-weight:400; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.nsd-nav-next-title { font-size:12px; font-weight:500; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%; text-align:center; }
.nsd-nav-site { width:44px; height:44px; border-radius:50%; border:1px solid var(--border); background:var(--srf2); color:var(--text); display:flex; align-items:center; justify-content:center; flex-shrink:0; text-decoration:none; transition:border-color .2s; }
.nsd-nav-site:hover { border-color:var(--muted); }
.nsd-nav-site svg { width:15px; height:15px; }

/* Swipe hint */
.nsd-swipe-hint { position:absolute; bottom:80px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.7); color:#fff; backdrop-filter:blur(8px); padding:8px 18px; border-radius:20px; font-size:12px; pointer-events:none; opacity:0; animation:nsd-hint 3.5s ease 1.2s forwards; white-space:nowrap; z-index:10; }
@keyframes nsd-hint { 0%{opacity:0;transform:translateX(-50%) translateY(6px)} 15%{opacity:1;transform:translateX(-50%) translateY(0)} 75%{opacity:1} 100%{opacity:0} }

/* ── Responsive ──────────────────────────────── */
@media(max-width:680px){
  .nsd-hdr { padding:0 20px; }
  .nsd-hero-content { padding:0 24px 40px; }
  .nsd-hero-dots { right:24px; }
  .nsd-row-hdr { padding:0 20px; }
  .nsd-track { padding:10px 20px 22px; }
  .nsd-card,.nsd-skel-card { flex:0 0 190px; height:108px; }
  .nsd-msg { padding:0 20px; }
  .nsd-story-body { padding:24px 20px 0; }
  .nsd-story-upnext { margin-left:20px; margin-right:20px; }
  .nsd-story-skel { padding:0 20px 24px; }
}
</style>

<div class="nsd" id="nsd-root">

  <header class="nsd-hdr">
    <a class="nsd-logo" href="https://nanusense.com" target="_blank" rel="noopener">
      <span class="nsd-logo-main">Nanusense</span>
      <span class="nsd-logo-sub">/ Discover</span>
    </a>
    <button class="nsd-theme-btn" id="nsd-theme-btn" aria-label="Toggle theme"></button>
  </header>

  <!-- GRID -->
  <div id="nsd-grid">
    <section class="nsd-hero" id="nsd-hero">
      <div class="nsd-hero-bg" id="nsd-hero-bg"></div>
      <div class="nsd-hero-veil"></div>
      <div class="nsd-hero-content" id="nsd-hero-content"></div>
      <div class="nsd-hero-dots" id="nsd-hero-dots"></div>
    </section>
    <main class="nsd-main" id="nsd-main"></main>
  </div>

  <!-- STORY MODE -->
  <div class="nsd-story" id="nsd-story" role="dialog" aria-modal="true" aria-label="Story reader">
    <div class="nsd-story-topbar">
      <button class="nsd-story-back" id="nsd-story-back" aria-label="Back to grid"></button>
      <div class="nsd-story-pills-wrap">
        <div class="nsd-story-pills" id="nsd-story-pills" role="tablist"></div>
      </div>
      <div class="nsd-story-counter" id="nsd-story-counter"></div>
    </div>
    <div class="nsd-story-prog-rail">
      <div class="nsd-story-prog-bar" id="nsd-story-prog-bar"></div>
    </div>
    <div class="nsd-story-scroll" id="nsd-story-scroll">
      <article class="nsd-story-article" id="nsd-story-article"></article>
    </div>
    <nav class="nsd-story-nav">
      <button class="nsd-nav-btn" id="nsd-nav-prev" aria-label="Previous story">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="nsd-nav-middle">
        <span class="nsd-nav-hint">Swipe left · right to navigate</span>
        <span class="nsd-nav-next-title" id="nsd-nav-next-title"></span>
      </div>
      <a class="nsd-nav-site" id="nsd-nav-site" href="#" target="_blank" rel="noopener" aria-label="Read on site">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      </a>
      <button class="nsd-nav-btn" id="nsd-nav-next" aria-label="Next story">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </nav>
  </div>

</div>

<script>
(function(){
'use strict';

const API = 'https://nanusense.com/wp-json/wp/v2';
const CAT_ORDER = ['sandbox','sandscapes','sandviper','featured','sand-up','sandwave','sleight-of-sand'];
const CAT = {
  'sandbox':         {label:'SandBox',        color:'#d4a853'},
  'sandscapes':      {label:'SandScapes',      color:'#7aab7a'},
  'sandviper':       {label:'SandViper',       color:'#e07a5f'},
  'featured':        {label:'Featured',        color:'#6b7fd7'},
  'sand-up':         {label:'Sand Up',         color:'#4ecdc4'},
  'sandwave':        {label:'SandWave',        color:'#74b3ce'},
  'sleight-of-sand': {label:'Sleight of Sand', color:'#c97fb7'},
};

const ROOT         = document.getElementById('nsd-root');
const MAIN         = document.getElementById('nsd-main');
const HERO_BG      = document.getElementById('nsd-hero-bg');
const HERO_CON     = document.getElementById('nsd-hero-content');
const HERO_DOTS    = document.getElementById('nsd-hero-dots');
const THEME_BTN    = document.getElementById('nsd-theme-btn');
const STORY        = document.getElementById('nsd-story');
const STORY_BACK   = document.getElementById('nsd-story-back');
const STORY_PILLS  = document.getElementById('nsd-story-pills');
const STORY_CTR    = document.getElementById('nsd-story-counter');
const STORY_PROG   = document.getElementById('nsd-story-prog-bar');
const STORY_SCROLL = document.getElementById('nsd-story-scroll');
const STORY_ART    = document.getElementById('nsd-story-article');
const NAV_PREV     = document.getElementById('nsd-nav-prev');
const NAV_NEXT     = document.getElementById('nsd-nav-next');
const NAV_SITE     = document.getElementById('nsd-nav-site');
const NAV_NEXTTITLE= document.getElementById('nsd-nav-next-title');

const SVG_SUN  = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
const SVG_MOON = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
const SVG_BACK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>`;
const SVG_PLAY = `<svg viewBox="0 0 24 24" fill="white"><polygon points="5,3 19,12 5,21"/></svg>`;
const SVG_SHUF = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/></svg>`;

/* ── THEME ── */
const savedTheme = localStorage.getItem('nsd-theme') ||
  (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
function applyTheme(t) {
  ROOT.dataset.theme = t;
  document.body.className = t === 'light' ? 'light' : '';
  THEME_BTN.innerHTML = t === 'dark' ? SVG_SUN : SVG_MOON;
}
THEME_BTN.addEventListener('click', () => {
  const n = ROOT.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(n); localStorage.setItem('nsd-theme', n);
});
applyTheme(savedTheme);

/* ── UTILS ── */
const strip = h => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent || ''; };
const fmt   = iso => new Date(iso).toLocaleDateString('en-US',{month:'short',year:'numeric'});
const pick  = a => a[Math.floor(Math.random()*a.length)];

function readingMins(html) {
  return Math.max(1, Math.round(strip(html).trim().split(/\s+/).length / 200));
}

function getFeatImg(post, size) {
  try {
    const m = post._embedded?.['wp:featuredmedia']?.[0];
    if (!m || m.code) return null;
    return (size && m.media_details?.sizes?.[size]?.source_url)
      || m.media_details?.sizes?.large?.source_url
      || m.media_details?.sizes?.medium_large?.source_url
      || m.source_url || null;
  } catch { return null; }
}

function processContent(html) {
  const div = document.createElement('div');
  div.innerHTML = html;
  div.querySelectorAll('iframe').forEach(iframe => {
    const src = iframe.getAttribute('src') || '';
    const m = src.match(/(?:youtube\.com\/embed\/|youtu\.be\/)([A-Za-z0-9_-]{11})/);
    if (!m) return;
    const vid = m[1];
    const wrap = document.createElement('div');
    wrap.className = 'nsd-yt-wrap';
    wrap.innerHTML = `<img src="https://img.youtube.com/vi/${vid}/hqdefault.jpg" alt="YouTube video" loading="lazy">
      <a class="nsd-yt-btn" href="https://www.youtube.com/watch?v=${vid}" target="_blank" rel="noopener" aria-label="Watch on YouTube">
        <svg viewBox="0 0 68 48"><path d="M66.5 7.8a8.5 8.5 0 0 0-6-6C56.1 0 34 0 34 0S11.9 0 7.5 1.8a8.5 8.5 0 0 0-6 6C0 12.2 0 24 0 24s0 11.8 1.5 16.2a8.5 8.5 0 0 0 6 6C11.9 48 34 48 34 48s22.1 0 26.5-1.8a8.5 8.5 0 0 0 6-6C68 35.8 68 24 68 24s0-11.8-1.5-16.2z" fill="#FF0000"/><polygon points="45,24 27,14 27,34" fill="white"/></svg>
      </a>`;
    iframe.parentNode.replaceChild(wrap, iframe);
  });
  div.querySelectorAll('img').forEach(img => {
    const s = img.getAttribute('src');
    if (s && s.startsWith('/')) img.setAttribute('src','https://nanusense.com'+s);
    img.setAttribute('loading','lazy');
  });
  div.querySelectorAll('a').forEach(a => { a.target='_blank'; a.rel='noopener'; });
  return div.innerHTML;
}

/* ── STATE ── */
let allPosts = [], catSlugById = {}, catMap = {};
let heroPosts = [], heroIdx = 0, heroTimer = null;
let storyQueue = [], storyIdx = 0, activeFilter = 'all';
const postCache = new Map();
let swipeHintShown = localStorage.getItem('nsd-swipe-hint') === '1';

/* ── DISCOVERY QUEUE (weights older posts 2-3x) ── */
function buildQueue(posts, startPost, filterSlug) {
  let pool = [...posts];
  if (filterSlug && filterSlug !== 'all') {
    const id = Object.values(catMap).find(c => c.slug === filterSlug)?.id;
    if (id) pool = pool.filter(p => p.categories?.includes(id));
  }
  const now = Date.now();
  const scored = pool.map(p => {
    const days = (now - new Date(p.date)) / 86400000;
    const w = days > 180 ? 3 : days > 90 ? 2 : 1;
    return { p, s: w * (0.4 + Math.random()) };
  });
  scored.sort((a,b) => b.s - a.s);
  const q = scored.map(s => s.p);
  if (startPost) {
    const i = q.findIndex(p => p.id === startPost.id);
    if (i > 0) { q.splice(i,1); q.unshift(startPost); }
    else if (i === -1) q.unshift(startPost);
  }
  return q;
}

function getCfg(post) {
  const slug = catSlugById[post.categories?.[0]] || 'sandbox';
  return CAT[slug] || CAT['sandbox'];
}

/* ── PREFETCH ── */
async function prefetch(post) {
  if (!post || postCache.has(post.id)) return;
  try {
    const d = await fetch(`${API}/posts/${post.id}?_embed=wp:featuredmedia&_fields=id,title,content,date,link,_embedded,_links`).then(r=>r.json());
    postCache.set(post.id, d);
  } catch {}
}

/* ══ STORY ══════════════════════════════════════ */
function enterStory(startPost, filterSlug) {
  activeFilter = filterSlug || 'all';
  storyQueue = buildQueue(allPosts, startPost, activeFilter);
  storyIdx = 0;
  buildPills();
  STORY.classList.add('open');
  document.body.style.overflow = 'hidden';
  loadStory(storyQueue[0], 'none');
}

function exitStory() {
  STORY.classList.remove('open');
  document.body.style.overflow = '';
  STORY_SCROLL.scrollTop = 0;
}

function goTo(idx, dir) {
  if (idx < 0 || idx >= storyQueue.length) return;
  storyIdx = idx;
  STORY_SCROLL.scrollTop = 0;
  loadStory(storyQueue[idx], dir);
  updateNav();
}

function prevStory() { if (storyIdx > 0) goTo(storyIdx-1, 'right'); }
function nextStory() { if (storyIdx < storyQueue.length-1) goTo(storyIdx+1, 'left'); }

function updateNav() {
  NAV_PREV.disabled = storyIdx === 0;
  const np = storyQueue[storyIdx+1];
  NAV_NEXT.disabled = !np;
  NAV_NEXTTITLE.textContent = np ? strip(np.title?.rendered||'') : '';
  STORY_CTR.textContent = `${storyIdx+1} / ${storyQueue.length}`;
}

/* ── Load ── */
async function loadStory(post, dir) {
  const cfg = getCfg(post);
  STORY.style.setProperty('--accent', cfg.color);
  STORY_PROG.style.background = cfg.color;
  STORY_PROG.style.width = '0%';
  NAV_SITE.href = post.link || '#';
  updateNav();

  // Show optimistic skeleton with title + image
  showSkeleton(post, cfg, dir);

  let full = postCache.get(post.id);
  if (!full) {
    try {
      full = await fetch(`${API}/posts/${post.id}?_embed=wp:featuredmedia&_fields=id,title,content,date,link,_embedded,_links`).then(r=>r.json());
      postCache.set(post.id, full);
    } catch { return; }
  }
  renderContent(full, cfg, dir);
  prefetch(storyQueue[storyIdx+1]);
  prefetch(storyQueue[storyIdx+2]);
}

function showSkeleton(post, cfg, dir) {
  const img = getFeatImg(post,'large');
  const title = strip(post.title?.rendered||'');
  STORY_ART.className = 'nsd-story-article' + animClass(dir);
  STORY_ART.innerHTML = `
    ${img
      ? `<div class="nsd-story-img-wrap"><img class="nsd-story-img" src="${img}" alt=""></div>`
      : `<div class="nsd-story-img-placeholder" style="background:linear-gradient(135deg,${cfg.color} 0%,var(--srf2) 100%)">NANUSENSE</div>`
    }
    <div class="nsd-story-body">
      <div class="nsd-story-meta">
        <span class="nsd-story-cat-pill" style="background:${cfg.color}">${cfg.label}</span>
        <span class="nsd-story-meta-info">${fmt(post.date)}</span>
      </div>
      <h1 class="nsd-story-title">${title}</h1>
      <div class="nsd-story-skel">
        <div class="nsd-skel-line" style="height:13px;width:100%"></div>
        <div class="nsd-skel-line" style="height:13px;width:94%"></div>
        <div class="nsd-skel-line" style="height:13px;width:87%"></div>
        <div class="nsd-skel-line" style="height:13px;width:91%"></div>
        <div class="nsd-skel-line" style="height:13px;width:78%"></div>
      </div>
    </div>`;
}

function renderContent(post, cfg, dir) {
  const title   = strip(post.title?.rendered||'Untitled');
  const date    = fmt(post.date);
  const mins    = readingMins(post.content?.rendered||'');
  const content = processContent(post.content?.rendered||'<p>Content unavailable.</p>');
  const link    = post.link||'#';
  const img     = getFeatImg(post,'large');
  const np      = storyQueue[storyIdx+1];
  const npCfg   = np ? getCfg(np) : null;
  const npImg   = np ? getFeatImg(np,'thumbnail') : null;
  const npTitle = np ? strip(np.title?.rendered||'') : '';

  NAV_SITE.href = link;
  STORY_ART.className = 'nsd-story-article' + animClass(dir);
  STORY_ART.innerHTML = `
    ${img
      ? `<div class="nsd-story-img-wrap"><img class="nsd-story-img" src="${img}" alt="${title}" loading="eager"></div>`
      : `<div class="nsd-story-img-placeholder" style="background:linear-gradient(135deg,${cfg.color} 0%,var(--srf2) 100%)">NANUSENSE</div>`
    }
    <div class="nsd-story-body">
      <div class="nsd-story-meta">
        <span class="nsd-story-cat-pill" style="background:${cfg.color}">${cfg.label}</span>
        <span class="nsd-story-meta-info">${date}&nbsp;·&nbsp;${mins} min read</span>
      </div>
      <h1 class="nsd-story-title">${title}</h1>
      <div class="nsd-story-content">${content}</div>
    </div>
    ${np ? `
    <div class="nsd-story-upnext">
      <div class="nsd-upnext-label">Up Next</div>
      <div class="nsd-upnext-inner">
        ${npImg
          ? `<img class="nsd-upnext-thumb" src="${npImg}" alt="" loading="lazy">`
          : `<div class="nsd-upnext-thumb-ph" style="background:linear-gradient(135deg,${npCfg?.color||'#444'} 0%,var(--srf2) 100%)">N</div>`
        }
        <div class="nsd-upnext-info">
          <div class="nsd-upnext-cat" style="color:${npCfg?.color||'#d4a853'}">${npCfg?.label||''}</div>
          <div class="nsd-upnext-title">${npTitle}</div>
        </div>
      </div>
      <button class="nsd-upnext-btn" id="nsd-upnext-btn" style="background:${cfg.color}">Keep Reading →</button>
    </div>` : ''}
    ${!swipeHintShown ? `<div class="nsd-swipe-hint">Swipe left for next story</div>` : ''}`;

  document.getElementById('nsd-upnext-btn')?.addEventListener('click', nextStory);
  if (!swipeHintShown) { swipeHintShown = true; localStorage.setItem('nsd-swipe-hint','1'); }
}

function animClass(dir) {
  if (dir === 'left')  return ' slide-left';
  if (dir === 'right') return ' slide-right';
  return '';
}

/* ── Category pills ── */
function buildPills() {
  STORY_PILLS.innerHTML = '';
  STORY_PILLS.appendChild(makePill('All','all','#888', activeFilter==='all'));
  CAT_ORDER.forEach(slug => {
    const cfg = CAT[slug];
    const id = catMap[slug]?.id;
    if (!id || !allPosts.some(p => p.categories?.includes(id))) return;
    STORY_PILLS.appendChild(makePill(cfg.label, slug, cfg.color, activeFilter===slug));
  });
}

function makePill(label, slug, color, active) {
  const btn = document.createElement('button');
  btn.className = 'nsd-story-pill' + (active ? ' active' : '');
  btn.style.setProperty('--pill-color', color);
  btn.textContent = label;
  btn.setAttribute('role','tab');
  btn.addEventListener('click', () => {
    if (activeFilter === slug) return;
    activeFilter = slug;
    storyQueue = buildQueue(allPosts, storyQueue[storyIdx], slug);
    storyIdx = 0;
    buildPills();
    STORY_SCROLL.scrollTop = 0;
    loadStory(storyQueue[0], 'none');
  });
  return btn;
}

/* ── Events ── */
STORY_BACK.innerHTML = SVG_BACK;
STORY_BACK.addEventListener('click', exitStory);
NAV_PREV.addEventListener('click', prevStory);
NAV_NEXT.addEventListener('click', nextStory);

document.addEventListener('keydown', e => {
  if (!STORY.classList.contains('open')) return;
  if (e.key==='ArrowRight') nextStory();
  if (e.key==='ArrowLeft')  prevStory();
  if (e.key==='Escape')     exitStory();
});

// Reading progress bar
STORY_SCROLL.addEventListener('scroll', () => {
  const max = STORY_SCROLL.scrollHeight - STORY_SCROLL.clientHeight;
  STORY_PROG.style.width = (max > 0 ? STORY_SCROLL.scrollTop/max*100 : 0) + '%';
}, {passive:true});

// Swipe: horizontal dominant, doesn't fight vertical scroll
let tsX=0, tsY=0, tsT=0;
STORY_SCROLL.addEventListener('touchstart', e => {
  tsX=e.touches[0].clientX; tsY=e.touches[0].clientY; tsT=Date.now();
}, {passive:true});
STORY_SCROLL.addEventListener('touchend', e => {
  const dx=e.changedTouches[0].clientX-tsX, dy=e.changedTouches[0].clientY-tsY;
  if (Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.8 && Date.now()-tsT<450) {
    dx<0 ? nextStory() : prevStory();
  }
}, {passive:true});

/* ══ HERO ═══════════════════════════════════════ */
function setHero(post, animate) {
  const cfg = getCfg(post);
  const img = getFeatImg(post,'large');
  const title = strip(post.title?.rendered||'');
  const excerpt = strip(post.excerpt?.rendered||'');

  const render = () => {
    HERO_BG.style.backgroundImage = img ? `url('${img}')` : `linear-gradient(135deg,${cfg.color} 0%,#111 100%)`;
    HERO_CON.innerHTML = `
      <div class="nsd-hero-pill" style="background:${cfg.color}">${cfg.label}</div>
      <h2 class="nsd-hero-title">${title}</h2>
      ${excerpt?`<p class="nsd-hero-excerpt">${excerpt.substring(0,200)}${excerpt.length>200?'…':''}</p>`:''}
      <div class="nsd-hero-btns">
        <a class="nsd-hero-btn-a" href="${post.link||'#'}" target="_blank" rel="noopener">${SVG_PLAY} Read Now</a>
        <button class="nsd-hero-btn-b" id="nsd-hero-disc">${SVG_SHUF} Discover All</button>
      </div>`;
    document.getElementById('nsd-hero-disc')?.addEventListener('click', () => enterStory(post,'all'));
  };

  if (animate) {
    HERO_CON.style.opacity='0'; HERO_BG.style.opacity='0';
    setTimeout(() => { render(); HERO_CON.style.opacity='1'; HERO_BG.style.opacity='1'; }, 500);
  } else render();
}

function updateDots() {
  HERO_DOTS.innerHTML='';
  heroPosts.slice(0,6).forEach((_,i) => {
    const d=document.createElement('button');
    d.className='nsd-hero-dot'+(i===heroIdx?' active':'');
    d.setAttribute('aria-label',`Story ${i+1}`);
    d.addEventListener('click',()=>{clearInterval(heroTimer);heroIdx=i;setHero(heroPosts[i],true);updateDots();startHeroTimer();});
    HERO_DOTS.appendChild(d);
  });
}

function startHeroTimer() {
  clearInterval(heroTimer);
  if (heroPosts.length<2) return;
  heroTimer=setInterval(()=>{
    heroIdx=(heroIdx+1)%Math.min(heroPosts.length,6);
    setHero(heroPosts[heroIdx],true); updateDots();
  },8000);
}

/* ══ GRID ════════════════════════════════════════ */
function skelCards(t,n){for(let i=0;i<n;i++){const c=document.createElement('div');c.className='nsd-skel-card';t.appendChild(c);}}

function renderSkeletons() {
  MAIN.innerHTML='';
  HERO_CON.innerHTML=`<div style="display:flex;flex-direction:column;gap:10px;padding-bottom:16px">
    <div class="nsd-skel-line" style="height:11px;width:80px;border-radius:4px;margin-bottom:6px"></div>
    <div class="nsd-skel-line" style="height:42px;width:78%"></div>
    <div class="nsd-skel-line" style="height:42px;width:55%;margin-bottom:10px"></div>
    <div class="nsd-skel-line" style="height:11px;width:92%"></div>
    <div class="nsd-skel-line" style="height:11px;width:74%"></div>
  </div>`;
  CAT_ORDER.forEach((slug,i)=>{
    const cfg=CAT[slug]; if(!cfg) return;
    const row=document.createElement('div'); row.className='nsd-row'; row.style.animationDelay=`${i*.045}s`;
    row.innerHTML=`<div class="nsd-row-hdr"><span class="nsd-row-name" style="--row-color:${cfg.color}">${cfg.label}</span><div class="nsd-row-rule"></div><div class="nsd-skel-line" style="height:28px;width:90px;border-radius:4px"></div></div>`;
    const wrap=document.createElement('div'); wrap.className='nsd-track-wrap';
    const track=document.createElement('div'); track.className='nsd-track';
    skelCards(track,6); wrap.appendChild(track); row.appendChild(wrap); MAIN.appendChild(row);
  });
}

function makeCard(post, cfg) {
  const img=getFeatImg(post,'medium_large'), title=strip(post.title?.rendered||'Untitled'), date=fmt(post.date);
  const card=document.createElement('button');
  card.className='nsd-card'; card.setAttribute('aria-label',title);
  card.style.setProperty('--row-color',cfg.color);
  card.innerHTML=`${img?`<img class="nsd-card-img" src="${img}" alt="" loading="lazy">`:''}
    <div class="nsd-card-grad"></div>
    <div class="nsd-card-body"><div class="nsd-card-date">${date}</div><div class="nsd-card-title">${title}</div></div>
    <div class="nsd-card-hover"><span class="nsd-card-play">${SVG_PLAY} Read</span></div>`;
  card.addEventListener('click', ()=>enterStory(post,'all'));
  return card;
}

function renderRows(grouped) {
  MAIN.innerHTML='';
  CAT_ORDER.forEach((slug,i)=>{
    const cfg=CAT[slug]; if(!cfg) return;
    const meta=catMap[slug], catId=meta?.id;
    const posts=(catId&&grouped[catId])||[], count=meta?.count??posts.length;
    const row=document.createElement('div'); row.className='nsd-row'; row.style.animationDelay=`${i*.055}s`;
    const hdr=document.createElement('div'); hdr.className='nsd-row-hdr';
    hdr.innerHTML=`<span class="nsd-row-name" style="--row-color:${cfg.color}">${cfg.label}</span>
      <span class="nsd-row-count">${count} ${count===1?'post':'posts'}</span>
      <div class="nsd-row-rule"></div>
      <button class="nsd-shuffle-btn" style="--row-color:${cfg.color}" aria-label="Shuffle ${cfg.label}">${SVG_SHUF} Shuffle</button>`;
    const wrap=document.createElement('div'); wrap.className='nsd-track-wrap';
    const track=document.createElement('div'); track.className='nsd-track';
    if (!posts.length) { wrap.innerHTML=`<p class="nsd-msg">No posts in this category.</p>`; }
    else { posts.forEach(p=>track.appendChild(makeCard(p,cfg))); wrap.appendChild(track); }
    hdr.querySelector('.nsd-shuffle-btn').addEventListener('click',()=>{ if(posts.length) enterStory(pick(posts),slug); });
    row.appendChild(hdr); row.appendChild(wrap); MAIN.appendChild(row);
  });
}

/* ══ BOOT ════════════════════════════════════════ */
async function boot() {
  renderSkeletons();
  try {
    const [cR,p1R,p2R] = await Promise.all([
      fetch(`${API}/categories?per_page=50`),
      fetch(`${API}/posts?per_page=100&page=1&_embed=wp:featuredmedia&_fields=id,title,excerpt,date,link,categories,featured_media,_links,_embedded`),
      fetch(`${API}/posts?per_page=100&page=2&_embed=wp:featuredmedia&_fields=id,title,excerpt,date,link,categories,featured_media,_links,_embedded`),
    ]);
    const cats=await cR.json(), page1=await p1R.json(), page2=p2R.ok?await p2R.json():[];

    cats.forEach(c=>{
      if(c.slug&&c.slug!=='uncategorized'){
        catMap[c.slug]={id:c.id,name:c.name,count:c.count,slug:c.slug};
        catSlugById[c.id]=c.slug;
      }
    });

    allPosts=[...page1,...(Array.isArray(page2)?page2:[])];
    const grouped={};
    allPosts.forEach(p=>{const id=p.categories?.[0]; if(id){if(!grouped[id])grouped[id]=[];grouped[id].push(p);}});

    const featId=catMap['featured']?.id;
    const featPosts=featId?(grouped[featId]||[]):[];
    const withImg=list=>list.filter(p=>getFeatImg(p));
    heroPosts=withImg(featPosts).length?withImg(featPosts):withImg(allPosts);
    if(!heroPosts.length) heroPosts=featPosts.length?featPosts:allPosts.slice(0,6);

    heroIdx=0; setHero(heroPosts[0],false); updateDots(); startHeroTimer();
    renderRows(grouped);
  } catch {
    MAIN.innerHTML=`<p class="nsd-msg" style="padding-top:40px">Failed to load posts. Please refresh.</p>`;
  }
}

boot();
})();
</script>
